name: partitionlog-load

on:
  pull_request:
    paths:
      - "partitionlog/**"
      - "internal/blobstore/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/partitionlog-load.yml"
  schedule:
    - cron: "17 3 * * *" # nightly ci profile on main
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      profile:
        description: smoke | ci | deep
        default: ci
      provider:
        description: minio | azurite | fake-gcs | s3 | azure | gcs
        default: minio
      scenario:
        description: scenario name, or "all"
        default: all

concurrency:
  group: load-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

# Default token is read-only. Only the two jobs that post comments get
# pull-requests: write, and those jobs never execute code from the PR.
permissions:
  contents: read

jobs:
  # ---- automatic smoke on every PR: structural invariants + coarse thresholds
  smoke:
    if: github.event_name == 'pull_request'
    name: smoke ${{ matrix.provider }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        provider: [minio, azurite, fake-gcs]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build plbench
        run: go build -o bin/plbench ./partitionlog/internal/cmd/plbench
      - name: Start emulator
        run: .github/scripts/start-emulator.sh ${{ matrix.provider }}
      - name: Restore rolling baseline (latest green nightly on main)
        uses: actions/cache/restore@v4
        with:
          path: partitionlog/internal/bench/baselines
          key: plbench-baselines-${{ matrix.provider }}-${{ runner.os }}-never
          restore-keys: plbench-baselines-${{ matrix.provider }}-${{ runner.os }}-
      - name: Run smoke
        id: run
        run: |
          set -o pipefail
          .github/scripts/load-run.sh smoke ${{ matrix.provider }} 2>&1 | tee smoke.log
      - name: Summarize
        if: always()
        run: |
          mkdir -p results/report
          for f in results/*.json; do
            [ -e "$f" ] || continue
            bin/plbench compare "$f" -format github >> "$GITHUB_STEP_SUMMARY" || true
            name=$(basename "$f" .json)
            if bin/plbench compare "$f" -format github -only-changed > "results/report/$name.md" 2>/dev/null; then
              echo pass > "results/report/$name.status"
            else
              echo fail > "results/report/$name.status"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-smoke-${{ matrix.provider }}
          # Two paths => the artifact root is the workspace, so files land at
          # results/<file>.json and results/report/* inside the artifact.
          path: |
            results/**
            smoke.log
          retention-days: 30

  # ---- one sticky PR comment covering every provider, updated on each push
  report:
    if: github.event_name == 'pull_request' && always()
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    # No checkout: this job must never run files from the PR. It only reads
    # the artifacts with jq and posts the comment.
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: load-smoke-*
          path: artifacts
      - name: Compose comment
        run: |
          {
            echo '<!-- plbench:smoke -->'
            echo "### plbench smoke · head \`${HEAD_SHA::7}\` · [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo
            echo '| provider | result | checks passed | checks failed | beyond threshold |'
            echo '|---|---|---:|---:|---:|'
            for prov in minio azurite fake-gcs; do
              dir="artifacts/load-smoke-$prov/results"
              if ! ls "$dir"/*.json >/dev/null 2>&1; then echo "| $prov | ❌ no results (job failed before writing) | — | — | — |"; continue; fi
              ok=0; bad=0; over=0
              for f in "$dir"/*.json; do
                ok=$((ok + $(jq '[.checks[] | select(.ok)] | length' "$f")))
                bad=$((bad + $(jq '[.checks[] | select(.ok|not)] | length' "$f")))
                st="$dir/report/$(basename "$f" .json).status"
                [ -f "$st" ] && grep -q fail "$st" && over=$((over + 1))
              done
              mark="✅"; if [ "$bad" -gt 0 ] || [ "$over" -gt 0 ]; then mark="❌"; fi
              echo "| $prov | $mark | $ok | $bad | $over |"
            done
            echo
            for prov in minio azurite fake-gcs; do
              for md in artifacts/load-smoke-$prov/results/report/*.md; do
                [ -e "$md" ] || continue
                # Append a provider's rows only on a real failure; ⚠️ drift rows stay in the job summary.
                if grep -q '❌' "$md"; then cat "$md"; echo; fi
              done
            done
            echo '<sub>Providers with no rows below the table: every structural check passed and no metric left its threshold band (or no baseline exists yet). Full tables are in each job summary; raw results are attached as artifacts.</sub>'
          } > comment.md
          cat comment.md
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Post or update sticky comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            const marker = '<!-- plbench:smoke -->';
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  # ---- nightly ci profile on main, and manual dispatch
  scheduled:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: ${{ github.event.inputs.profile || 'ci' }} ${{ matrix.provider }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ github.event_name == 'schedule' && fromJSON('["minio","azurite","fake-gcs"]') || fromJSON(format('["{0}"]', github.event.inputs.provider)) }}
    env:
      PLBENCH_S3_BUCKET: ${{ secrets.PLBENCH_S3_BUCKET }}
      PLBENCH_AZURE_CONNECTION_STRING: ${{ secrets.PLBENCH_AZURE_CONNECTION_STRING }}
      PLBENCH_GCS_BUCKET: ${{ secrets.PLBENCH_GCS_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build plbench
        run: go build -o bin/plbench ./partitionlog/internal/cmd/plbench
      - name: Start emulator
        run: .github/scripts/start-emulator.sh ${{ matrix.provider }}
      - name: Restore rolling baseline
        uses: actions/cache/restore@v4
        with:
          path: partitionlog/internal/bench/baselines
          key: plbench-baselines-${{ matrix.provider }}-${{ runner.os }}-never
          restore-keys: plbench-baselines-${{ matrix.provider }}-${{ runner.os }}-
      - name: Run
        id: run
        run: |
          set -o pipefail
          scenarios="${{ github.event.inputs.scenario || 'all' }}"
          if [ "$scenarios" = all ]; then scenarios="catalog_isolated catalog_history"; fi
          if [ "${{ github.event_name }}" = schedule ]; then profiles="smoke ci"; else profiles="${{ github.event.inputs.profile || 'ci' }}"; fi
          status=0
          for profile in $profiles; do
            .github/scripts/load-run.sh "$profile" ${{ matrix.provider }} $scenarios 2>&1 | tee -a run.log || status=$?
          done
          exit $status
      - name: Promote results to the rolling baseline
        if: success() && github.event_name == 'schedule' && github.ref == 'refs/heads/main'
        run: |
          for f in results/*.json; do
            bin/plbench baseline "$f"
          done
      - name: Save rolling baseline
        if: success() && github.event_name == 'schedule' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: partitionlog/internal/bench/baselines
          key: plbench-baselines-${{ matrix.provider }}-${{ runner.os }}-${{ github.run_id }}
      - name: Summarize
        if: always()
        run: |
          for f in results/*.json; do
            bin/plbench compare "$f" -format github >> "$GITHUB_STEP_SUMMARY" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-${{ github.event.inputs.profile || 'ci' }}-${{ matrix.provider }}-${{ github.run_id }}
          path: |
            results/*.json
            run.log
          retention-days: 90

  # ---- "/bench <profile> [provider]" on a PR, collaborators only.
  # Two jobs on purpose: command-run checks out and executes PR code with a
  # read-only token and no persisted credentials; command-reply holds the
  # write token, never checks anything out, and only reads the artifact.
  command-run:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/bench')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      profile: ${{ steps.parse.outputs.profile }}
      provider: ${{ steps.parse.outputs.provider }}
    steps:
      - name: Authorize
        uses: actions/github-script@v7
        with:
          script: |
            const ok = ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(context.payload.comment.author_association);
            if (!ok) core.setFailed('only collaborators may run /bench');
      - name: Parse
        id: parse
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          # Whitelist the two arguments; anything else falls back to defaults.
          set -- $COMMENT
          profile="${2:-ci}"; provider="${3:-minio}"
          case "$profile" in smoke|ci|deep) ;; *) profile=ci ;; esac
          case "$provider" in minio|azurite|fake-gcs) ;; *) provider=minio ;; esac
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build plbench
        run: go build -o bin/plbench ./partitionlog/internal/cmd/plbench
      - name: Start emulator
        run: .github/scripts/start-emulator.sh ${{ steps.parse.outputs.provider }}
      - name: Restore rolling baseline
        uses: actions/cache/restore@v4
        with:
          path: partitionlog/internal/bench/baselines
          key: plbench-baselines-${{ steps.parse.outputs.provider }}-${{ runner.os }}-never
          restore-keys: plbench-baselines-${{ steps.parse.outputs.provider }}-${{ runner.os }}-
      - name: Run
        run: |
          set -o pipefail
          .github/scripts/load-run.sh ${{ steps.parse.outputs.profile }} ${{ steps.parse.outputs.provider }} 2>&1 | tee run.log || true
          mkdir -p results/report
          for f in results/*.json; do
            [ -e "$f" ] || continue
            name=$(basename "$f" .json)
            if bin/plbench compare "$f" -format github > "results/report/$name.md" 2>/dev/null; then
              echo pass > "results/report/$name.status"
            else
              echo fail > "results/report/$name.status"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-command-${{ github.run_id }}
          path: |
            results/**
            run.log
          retention-days: 30

  command-reply:
    if: github.event_name == 'issue_comment' && always() && needs.command-run.result != 'skipped'
    needs: command-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    # No checkout: never execute PR code with the write token.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: load-command-${{ github.run_id }}
          path: artifact
      - name: Compose reply
        run: |
          {
            echo "<!-- plbench:${{ needs.command-run.outputs.profile }}:${{ needs.command-run.outputs.provider }} -->"
            echo "### plbench ${{ needs.command-run.outputs.profile }} · ${{ needs.command-run.outputs.provider }} · [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo
            if [ "${{ needs.command-run.result }}" != success ]; then echo "❌ run job ended with status **${{ needs.command-run.result }}**"; echo; fi
            for md in artifact/results/report/*.md; do
              [ -e "$md" ] || { echo "no results were produced"; break; }
              cat "$md"; echo
            done
          } > comment.md
          cat comment.md
      - name: Post or update sticky comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            const marker = body.split('\n')[0];
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
