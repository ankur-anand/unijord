name: partitionlog format compatibility

on:
  pull_request:
    paths:
      - ".github/workflows/partitionlog-format.yml"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "partitionlog/segblock/**"
      - "partitionlog/segformat/**"
      - "partitionlog/segreader/**"
      - "partitionlog/segwriter/**"
      - "partitionlog/testdata/segformat/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/partitionlog-format.yml"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "partitionlog/segblock/**"
      - "partitionlog/segformat/**"
      - "partitionlog/segreader/**"
      - "partitionlog/segwriter/**"
      - "partitionlog/testdata/segformat/**"
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make compatibility
      - run: go test ./partitionlog/segformat ./partitionlog/segreader ./partitionlog/segwriter -count=1

  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./partitionlog/segformat
            target: FuzzParseFilePreamble
          - package: ./partitionlog/segformat
            target: FuzzParseBlockPreamble
          - package: ./partitionlog/segformat
            target: FuzzParseIndexPreamble
          - package: ./partitionlog/segformat
            target: FuzzParseBlockIndexEntry
          - package: ./partitionlog/segformat
            target: FuzzParseTrailer
          - package: ./partitionlog/segformat
            target: FuzzDecodeRawBlock
          - package: ./partitionlog/segformat
            target: FuzzParseBlockIndex
          - package: ./partitionlog/segreader
            target: FuzzOpenAndScanSegment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ${{ matrix.package }} -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime=10m
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: |
            partitionlog/segformat/testdata/fuzz
            partitionlog/segreader/testdata/fuzz
          if-no-files-found: ignore
